{% if filtro_form %}
<form method="get" class="filtros no-imprimir">
  {% if q %}<input type="hidden" name="q" value="{{ q }}">{% endif %}
  {% for campo in filtro_form %}
    <div class="campo"><label for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}</div>
  {% endfor %}
  {% if filtro_form.non_field_errors %}<div class="errores-form" style="grid-column:1/-1">{{ filtro_form.non_field_errors|join:" " }}</div>{% endif %}
  <div class="acciones"><a class="btn" href="?">Limpiar</a><button class="btn primario" type="submit">Filtrar</button></div>
</form>
{% endif %}
