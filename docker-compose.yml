services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Tegucigalpa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # publicar solo detrás de un proxy con HTTPS

  respaldo:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Tegucigalpa
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./respaldos:/respaldos
      - ./scripts/respaldar.sh:/respaldar.sh:ro
      - ./scripts/restaurar.sh:/restaurar.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /respaldar.sh; sleep 86400; done"]

volumes:
  pgdata:
